name: AyP HR Production

"on":
  push:
    branches:
      - ayp-production
  pull_request:
    branches:
      - ayp-production
    paths:
      - .github/workflows/ayp-production.yml
      - deploy/**
      - docker/**
      - hrms/**
  workflow_dispatch:

concurrency:
  group: ayp-hr-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rjuanluis/ayp-hrms
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Validate production source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate Python, JSON, shell and deployment files
        run: |
          python -m compileall -q hrms deploy/bootstrap_site.py deploy/configure_standard.py
          python -m json.tool deploy/apps.json >/dev/null
          bash -n deploy/deploy.sh deploy/host-deploy-wrapper.sh deploy/provision-host.sh deploy/backup.sh
          node --check deploy/easypanel_compose_api.js
          python - <<'PY'
          from pathlib import Path
          text = Path('deploy/easypanel-compose.yml').read_text()
          required = ['configure-workers:', 'backend:', 'frontend:', 'websocket:', 'queue-short:', 'queue-long:', 'queue-documents:', 'scheduler:', 'db:', 'redis-cache:', 'redis-queue:', 'clamav:']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing EasyPanel Compose services: {missing}')
          if 'name: easypanel' not in text or 'external: true' not in text:
              raise SystemExit('EasyPanel external network is not configured')
          deploy = Path('deploy/deploy.sh').read_text()
          helper = Path('deploy/easypanel_compose_api.js').read_text()
          required_deploy_contracts = [
              'deploy_compose_source',
              'local expected="${3:-11}"',
              'ROLLBACK_ARMED=1',
              'DEPLOY_PHASE="pre_migration"',
              'rollback_pre_migration',
              'queue-documents scheduler',
              'Verifying dedicated candidate-document worker',
              'compose_rollback',
          ]
          missing_deploy_contracts = [x for x in required_deploy_contracts if x not in deploy]
          if missing_deploy_contracts:
              raise SystemExit(f'Missing deployment topology contracts: {missing_deploy_contracts}')
          required_helper_contracts = [
              '/services/compose/updateSourceInline',
              '/services/compose/deployService',
              'canonicalSourceMatch',
              'preflight_ok',
          ]
          missing_helper_contracts = [x for x in required_helper_contracts if x not in helper]
          if missing_helper_contracts:
              raise SystemExit(f'Missing EasyPanel API contracts: {missing_helper_contracts}')
          hooks = Path('hrms/hooks.py').read_text()
          required_hooks = [
              'hrms.security.candidate_cv.guard_candidate_cv_upload',
              'hrms.security.candidate_cv.mark_scanned_candidate_cv_file',
              'hrms.security.candidate_cv.validate_job_applicant_cv',
              'hrms.recruitment.talent_pool.link_job_applicant_profile',
              'hrms.recruitment.talent_pool.sync_candidate_profile',
          ]
          missing_hooks = [hook for hook in required_hooks if hook not in hooks]
          if missing_hooks:
              raise SystemExit(f'Missing candidate CV security hooks: {missing_hooks}')
          workflow = Path('.github/workflows/ayp-production.yml').read_text()
          required_image_contracts = [
              'git archive --format=tar --output=frappe_docker/hrms-source.tar "$RELEASE_SHA"',
              'git get-tar-commit-id < frappe_docker/hrms-source.tar',
              'file:///opt/frappe/hrms-src',
              'apps.release.json',
              '/home/frappe/frappe-bench/apps/hrms/.ayp-release-sha',
              'antiword -h 2>&1 | grep -qi "antiword"',
              "github.event_name == 'push' && github.ref == 'refs/heads/ayp-production'",
          ]
          missing_image_contracts = [x for x in required_image_contracts if x not in workflow]
          if missing_image_contracts:
              raise SystemExit(f'Missing exact-image contracts: {missing_image_contracts}')
          PY

  build:
    name: Build and publish Frappe v16 + ERPNext + HRMS
    needs: validate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Checkout AyP HRMS source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Checkout official frappe_docker release
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: v3.2.1
          path: frappe_docker

      - name: Set immutable image reference
        id: image
        run: echo "value=${REGISTRY}/${IMAGE_NAME}:${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Stage exact AyP source and document runtime in production build context
        run: |
          git archive --format=tar --output=frappe_docker/hrms-source.tar "$RELEASE_SHA"
          test "$(git get-tar-commit-id < frappe_docker/hrms-source.tar)" = "$RELEASE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          apps = json.loads(Path("deploy/apps.json").read_text())
          hrms = [app for app in apps if app["url"].rstrip("/").endswith("/hrms")]
          if len(hrms) != 1:
              raise SystemExit("deploy/apps.json must contain exactly one HRMS source")
          hrms[0].update({"url": "file:///opt/frappe/hrms-src", "branch": "image-release"})
          Path("frappe_docker/apps.release.json").write_text(json.dumps(apps, indent=2) + "\n")

          containerfile = Path("frappe_docker/images/layered/Containerfile")
          text = containerfile.read_text()
          anchor = "USER frappe\n\nRUN --mount=type=secret,id=apps_json"
          replacement = (
              "USER frappe\n\n"
              "COPY --chown=frappe:frappe hrms-source.tar /tmp/hrms-source.tar\n"
              "RUN mkdir -p /opt/frappe/hrms-src \\\n"
              "    && tar -xf /tmp/hrms-source.tar -C /opt/frappe/hrms-src \\\n"
              "    && rm /tmp/hrms-source.tar \\\n"
              "    && cd /opt/frappe/hrms-src \\\n"
              "    && printf '%s\\n' \"${CACHE_BUST}\" > .ayp-release-sha \\\n"
              "    && git init \\\n"
              "    && git config user.name 'AyP Release Builder' \\\n"
              "    && git config user.email 'release-builder@aroypedal.com' \\\n"
              "    && git add . \\\n"
              "    && git commit -m \"AyP HRMS ${CACHE_BUST}\" \\\n"
              "    && git branch -M image-release\n\n"
              "RUN --mount=type=secret,id=apps_json"
          )
          if text.count(anchor) != 1:
              raise SystemExit("frappe_docker builder anchor changed")
          containerfile.write_text(text.replace(anchor, replacement, 1))
          PY
          install -m 0755 docker/configure_ayp_document_queue.py \
            frappe_docker/configure_ayp_document_queue.py
          cat >> frappe_docker/images/layered/Containerfile <<'EOF'
          USER root
          RUN mkdir -p /var/lib/apt/lists/partial \
              && apt-get update -qq \
              && apt-get install -y --no-install-recommends \
                antiword \
                libheif-examples \
                poppler-utils \
                tesseract-ocr \
                tesseract-ocr-eng \
                tesseract-ocr-spa \
              && rm -rf /var/lib/apt/lists/*
          COPY --chown=frappe:frappe configure_ayp_document_queue.py /usr/local/bin/configure-ayp-document-queue
          RUN chmod 0755 /usr/local/bin/configure-ayp-document-queue
          USER frappe
          EOF

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          platforms: linux/amd64
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ env.RELEASE_SHA }}
          secret-files: |
            apps_json=${{ github.workspace }}/frappe_docker/apps.release.json
          tags: |
            ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test candidate CV security in production image
        run: |
          docker pull "${{ steps.image.outputs.value }}"
          docker run --rm --entrypoint bash "${{ steps.image.outputs.value }}" -ec '
            test "$(cat /home/frappe/frappe-bench/apps/hrms/.ayp-release-sha)" = "${{ env.RELEASE_SHA }}"
            for executable in pdfinfo pdftotext pdftoppm tesseract antiword heif-convert; do
              command -v "$executable" >/dev/null
            done
            tesseract --list-langs 2>&1 | grep -Fxq eng
            tesseract --list-langs 2>&1 | grep -Fxq spa
            pdfinfo -v 2>&1 | grep -q "pdfinfo version"
            pdftotext -v 2>&1 | grep -q "pdftotext version"
            pdftoppm -v 2>&1 | grep -q "pdftoppm version"
            antiword -h 2>&1 | grep -qi "antiword"
            heif-convert --help 2>&1 | grep -q "heif-convert"
          '
          docker run --rm --entrypoint /usr/local/bin/configure-ayp-document-queue \
            "${{ steps.image.outputs.value }}" /tmp/common_site_config.json | \
            python -c 'import json,sys; result=json.load(sys.stdin); assert result == {"background_workers": 1, "queue": "documents", "timeout": 600}'
          docker run --rm --entrypoint bash "${{ steps.image.outputs.value }}" -lc '
            mkdir -p /tmp/frappe-test-sites/test /home/frappe/logs /home/frappe/frappe-bench/test/logs
            printf "{}\n" > /tmp/frappe-test-sites/test/site_config.json
            printf "frappe\nerpnext\nhrms\n" > /tmp/frappe-test-sites/apps.txt
            cd /home/frappe/frappe-bench
            ./env/bin/python - <<"PY"
          import unittest
          import frappe
          frappe.init(site="test", sites_path="/tmp/frappe-test-sites")
          try:
              suite = unittest.TestSuite()
              for test_module in (
                  "hrms.security.test_candidate_cv",
                  "hrms.recruitment.test_candidate_document_processing",
                  "hrms.recruitment.test_candidate_review_api",
                  "hrms.recruitment.test_candidate_review_security_contract",
                  "hrms.recruitment.test_candidate_review_domain",
                  "hrms.recruitment.test_candidate_scoring_domain",
                  "hrms.recruitment.test_interview_decision_domain",
                  "hrms.recruitment.test_talent_pool",
              ):
                  suite.addTests(unittest.defaultTestLoader.loadTestsFromName(test_module))
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful():
                  raise SystemExit(1)
          finally:
              frappe.destroy()
          PY
          '

      - name: Promote tested image to production alias
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ayp-production' }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:production" \
            "${{ steps.image.outputs.value }}"

  deploy:
    name: Deploy official hr.aroypedal.com
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ayp-production' && vars.AYP_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://hr.aroypedal.com
    steps:
      - name: Configure restricted deploy key
        env:
          DEPLOY_KEY: ${{ secrets.AYP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AYP_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
              aypdeploy@${{ vars.AYP_DEPLOY_HOST }} "deploy $IMAGE $GITHUB_ACTOR"
