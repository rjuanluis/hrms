name: Patch

on:
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.md'
      - '**.html'
      - '**.csv'
      - 'crowdin.yml'
      - '.mergify.yml'
      - '**.vue'
      - '**.pot'
      - '**.po'

  workflow_dispatch:

concurrency:
  group: patch-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: version-16
  ERPNEXT_BRANCH: version-16

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Patch Test

    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.13
            3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: |
          pip install frappe-bench
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server

      - name: Run Patch Tests
        run: |
          cd ~/frappe-bench/
          bench remove-app payments --force
          bench remove-app lending --force
          jq 'del(.install_apps)' ~/frappe-bench/sites/test_site/site_config.json > tmp.json
          mv tmp.json ~/frappe-bench/sites/test_site/site_config.json

          wget https://frappe.io/files/frappe-hr-v14-p.sql.gz
          bench --site test_site --force restore ~/frappe-bench/frappe-hr-v14-p.sql.gz

          git -C "apps/frappe" remote set-url upstream https://github.com/frappe/frappe.git
          git -C "apps/erpnext" remote set-url upstream https://github.com/frappe/erpnext.git
          git -C "apps/hrms" remote set-url upstream https://github.com/frappe/hrms.git


          function update_to_version() {
            version=$1

            branch_name="version-$version-hotfix"
            echo "Updating to v$version"

            # Fetch and checkout branches
            git -C "apps/frappe" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/erpnext" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/hrms" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/frappe" checkout -q -f $branch_name
            git -C "apps/erpnext" checkout -q -f $branch_name
            git -C "apps/hrms" checkout -q -f $branch_name

            # Resetup env and install apps
            pgrep honcho | xargs kill
            rm -rf ~/frappe-bench/env
            bench -v setup env --python python$2
            bench pip install -e ./apps/erpnext
            bench pip install -e ./apps/hrms
            bench start &>> ~/frappe-bench/bench_start.log &

            bench --site test_site migrate
          }

          update_to_version 15 3.13

          echo "Updating to latest version"
          git -C "apps/frappe" fetch --depth 1 upstream "$FRAPPE_BRANCH"
          git -C "apps/frappe" checkout -q -f FETCH_HEAD
          git -C "apps/erpnext" fetch --depth 1 upstream "$ERPNEXT_BRANCH"
          git -C "apps/erpnext" checkout -q -f FETCH_HEAD
          git -C "apps/hrms" checkout -q -f "$GITHUB_SHA"

          pgrep honcho | xargs kill
          rm -rf ~/frappe-bench/env
          bench -v setup env
          bench pip install -e ./apps/erpnext
          bench pip install -e ./apps/hrms
          bench start &>> ~/frappe-bench/bench_start.log &

          bench --site test_site migrate

      - name: Run disposable AyP configuration smoke
        env:
          AYP_SITE_NAME: ayp-smoke.local
          AYP_SITES_DIR: /home/runner/frappe-bench/sites
        run: |
          set -Eeuo pipefail
          cd ~/frappe-bench
          export AYP_ADMIN_PASSWORD="$(./env/bin/python -c 'import secrets; print(secrets.token_urlsafe(32))')"

          bench new-site "$AYP_SITE_NAME" \
            --db-type mariadb \
            --mariadb-root-password root \
            --admin-password "$AYP_ADMIN_PASSWORD" \
            --no-mariadb-socket
          bench --site "$AYP_SITE_NAME" install-app erpnext
          bench --site "$AYP_SITE_NAME" install-app hrms
          bench --site "$AYP_SITE_NAME" migrate

          ./env/bin/python "$GITHUB_WORKSPACE/deploy/configure_standard.py"
          ./env/bin/python "$GITHUB_WORKSPACE/deploy/configure_standard.py"

          ./env/bin/python - <<'PY'
          import os

          import frappe

          site = os.environ["AYP_SITE_NAME"]
          sites_path = os.environ["AYP_SITES_DIR"]
          os.chdir(sites_path)
          frappe.init(site=site)
          frappe.connect()
          try:
              assert frappe.db.exists("Company", "ARO Y PEDAL SRL")

              published_forms = frappe.get_all(
                  "Web Form",
                  filters={"doc_type": "Job Applicant", "published": 1},
                  fields=["name", "route"],
              )
              assert len(published_forms) == 1, published_forms
              assert published_forms[0]["route"] == "empleos/solicitud", published_forms

              for doctype, fieldname in (
                  ("File", "custom_av_scan_status"),
                  ("File", "custom_cv_sha256"),
                  ("Job Applicant", "custom_candidate_profile"),
                  ("Job Applicant", "custom_data_processing_consent"),
              ):
                  assert frappe.get_meta(doctype).has_field(fieldname), (doctype, fieldname)

              notification = frappe.get_doc("Notification", "AYP Candidate Application Received")
              assert notification.enabled == 1
              assert notification.document_type == "Job Applicant"
              assert notification.event == "New"
              assert len(notification.recipients) == 1
              assert notification.recipients[0].receiver_by_document_field == "email_id"

              sent_count = frappe.db.count("Email Queue", {"status": "Sent"})
              assert sent_count == 0
              queue_count = frappe.db.count("Email Queue")
              print(
                  {
                      "status": "configuration-smoke-pass",
                      "site": site,
                      "published_job_applicant_forms": published_forms,
                      "notification": notification.name,
                      "email_queue_count": queue_count,
                      "sent_email_count": sent_count,
                      "configure_runs": 2,
                  }
              )
          finally:
              frappe.destroy()
          PY

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cd ~/frappe-bench
          cat bench_start.log || true
          cd logs
          for f in ./*.log*; do
            echo "Printing log: $f";
            cat $f
          done